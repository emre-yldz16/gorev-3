<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ürün Listeleme Uygulaması</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <header class="bg-primary text-white py-4 mb-4">
    <div class="container">
      <h1 class="h3 mb-0">Ürün Listeleme Uygulaması</h1>
    </div>
  </header>

  <main class="container pb-4">
    <p id="message" role="status">Ürünler yükleniyor...</p>
    <div id="productList" class="row g-4"></div>
  </main>

  <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="modalTitle">Ürün Detayı</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
        </div>
        <div class="modal-body">
          <p id="detailMessage" role="status"></p>
          <div id="productDetail" hidden>
            <img id="detailImage" class="img-fluid d-block mx-auto mb-3" alt="">
            <p id="detailDescription"></p>
            <p>Kategori: <span id="detailCategory"></span></p>
            <p>Fiyat: <span id="detailPrice"></span></p>
            <p>Puan: <span id="detailRating"></span></p>
            <p>Stok: <span id="detailStock"></span></p>
            <p>Marka: <span id="detailBrand"></span></p>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Kapat</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
